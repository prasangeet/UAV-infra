[project]
name = "uav-ii"
version = "0.2.0"
description = "UAV infrastructure damage detection and CUBIT Inspect inference service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "numpy>=2.0.0",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.175",
]

[project.scripts]
cubit-api = "src.api.run:main"

[tool.ruff]
line-length = 100
target-version = "py311"
